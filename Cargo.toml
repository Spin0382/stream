[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/Spin0382/stream"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
    "net",
    "fs",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "brotli",
    "stream",
] }
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
tracing = "0.1"
eframe = "0.32"
egui = "0.32"

streamgoat-core = { path = "crates/core" }

# A deliberately small slice of morganlinton/BeautifulRust's tested lint set
# (lints/lints.toml). The pedantic group and `-D warnings` are a follow-up once the
# first pass of the port is done; keep the log readable until then.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic_in_result_fn = "warn"
string_add = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"
# The CLI and the UI print on purpose: this workspace ships applications, not a library.
print_stdout = "allow"
print_stderr = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
