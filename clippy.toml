# Ported from morganlinton/BeautifulRust (lints/clippy.toml).
#
# A bool argument is unreadable at the call site (`play(true)`) and cannot grow a
# third mode, so no function may take one.
max-fn-params-bools = 0

# In tests a panic is the assertion.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
