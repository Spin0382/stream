name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  # Pinned, not ubuntu-latest: the runner's glibc leaks into the binary, and a
  # newer runner produces a build that Mint 22 / Ubuntu 24.04 cannot start.
  build:
    name: release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (egui/winit)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release

      - name: Smoke test the CLI
        run: |
          ./target/release/streamgoat --version
          ./target/release/streamgoat --help

      - uses: actions/upload-artifact@v4
        with:
          name: streamgoat-linux-x86_64
          path: |
            target/release/streamgoat
            target/release/streamgoat-ui
          if-no-files-found: error
